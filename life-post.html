    <div id="post-content">
        <p class="loading">Loading post…</p>
    </div>

    <hr>
    <p>Contact: amartyadav[at]gmail[dot]com</p>

    <script>
        // Configure marked with highlight.js
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: false,
            gfm: true,
        });

        async function loadPost() {
            const container = document.getElementById('post-content');
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('post');

            if (!slug) {
                container.innerHTML = '<p class="error">No post specified. <a href="life-blog.html">Browse posts →</a></p>';
                return;
            }

            try {
                const res = await fetch(`/posts/life/${encodeURIComponent(slug)}.md`);
                if (!res.ok) throw new Error(`Post not found (${res.status})`);
                let md = await res.text();

                // Strip YAML front-matter (the --- ... --- block at the top).
                // It drives the listing metadata, not the rendered post body.
                md = md.replace(/^﻿?---\s*\r?\n[\s\S]*?\r?\n---\s*\r?\n?/, '');

                // Extract title from first H1 for page <title>
                const titleMatch = md.match(/^#\s+(.+)/m);
                if (titleMatch) {
                    document.title = titleMatch[1] + ' - Amartya Yadav';
                }

                container.innerHTML = marked.parse(md);

                // Trigger KaTeX auto-render after content is inserted
                if (window.renderMathInElement) {
                    renderMathInElement(container, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '$',  right: '$',  display: false },
                            { left: '```math', right: '```', display: true },
                        ],
                        throwOnError: false,
                    });
                }
            } catch (e) {
                container.innerHTML = `<p class="error">Could not load post: ${e.message}</p>
                    <p><a href="life-blog.html">← Back to Life Blog</a></p>`;
            }
        }

        // KaTeX loads deferred; wait for it before rendering math
        document.addEventListener('DOMContentLoaded', loadPost);
    </script>
